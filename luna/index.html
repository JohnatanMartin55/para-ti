<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tú eres la luna 🌙</title>
  <meta name="description" content="Una luna que crece contigo. Toca la luna." />
  <meta property="og:title" content="Tú eres la luna 🌙" />
  <meta property="og:description" content="Toca la luna y mira cómo brillas ✨" />
  <meta name="theme-color" content="#0b1030" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- botón invisible sobre la luna (para tocarla con teclado o lector de pantalla) -->
  <button class="moon-hit" id="moonHit" type="button" aria-label="Tocar la luna"></button>

  <main class="ui">
    <header class="top" id="top">
      <p class="eyebrow" id="eyebrow">para Sandy</p>
      <h1 class="title" id="title">Toca la luna</h1>
    </header>

    <section class="card" id="card" aria-live="polite">
      <p class="phase" id="phase">Luna nueva</p>
      <p class="msg" id="msg">Hay noches en que no te sientes brillar. Pero la luna nunca deja de estar completa, aunque no se vea. Tú tampoco.</p>
      <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>

    <div class="actions" id="actions">
      <button class="pill pill--main" id="signalBtn" type="button">🌙 Encender la señal</button>
      <button class="pill" id="letterBtn" type="button">💌 Leer mi carta</button>
    </div>
  </main>

  <!-- La señal de la luna -->
  <div class="modal" id="signal" hidden role="dialog" aria-modal="true" aria-labelledby="signalTitle">
    <article class="sheet">
      <button class="close" data-close type="button" aria-label="Cerrar">✕</button>
      <p class="sheet-eyebrow">la señal de la luna</p>
      <h2 id="signalTitle">Aquí estoy. Para lo que sea.</h2>
      <p class="sheet-sub">Cuando la noche se ponga oscura, enciende la luna. ¿Qué necesitas hoy?</p>
      <div class="options" id="options"></div>
      <p class="reply" id="reply" aria-live="polite"></p>
      <a class="pill pill--main wa" id="waBtn" hidden target="_blank" rel="noopener">💬 Escríbeme ahora</a>
    </article>
  </div>

  <!-- La carta -->
  <div class="modal" id="letter" hidden role="dialog" aria-modal="true" aria-labelledby="letterTitle">
    <article class="sheet sheet--paper">
      <button class="close" data-close type="button" aria-label="Cerrar">✕</button>
      <h2 id="letterTitle"></h2>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-sign" id="letterSign"></p>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button class="sound-toggle" id="soundBtn" type="button" aria-pressed="true" aria-label="Sonido activado">
    <span class="on" aria-hidden="true">🔊</span><span class="off" aria-hidden="true">🔇</span>
  </button>

  <script src="script.js?v=1"></script>
</body>
</html>
