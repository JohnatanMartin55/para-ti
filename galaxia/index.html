<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Te extraño poquito…</title>
  <meta name="description" content="Un erizo te quiere decir algo: te extraña poquito… o tal vez no tan poquito." />
  <meta property="og:title" content="Te extraño poquito… 🦔" />
  <meta property="og:description" content="Mira bien entre sus deditos ✨" />
  <meta name="theme-color" content="#fbf6ee" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦔</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>

  <!-- ============ ESCENA 1: el erizo ============ -->
  <section class="scene" id="scene">
    <div class="stage" id="stage">
      <h1 class="sr-only">Te extraño poquito…</h1>

      <button class="hog-btn" id="hogBtn" type="button" aria-label="Mirar de cerca entre sus deditos">
        <span class="hog" id="hog">
          <img id="erizo" src="img/erizo-1.webp" width="660" height="940" alt="Un erizo que dice: te extraño poquito…" draggable="false" />
          <span class="tap-ring" aria-hidden="true"></span>
        </span>
      </button>

      <button class="zoom-btn" id="zoomBtn" type="button">
        <span aria-hidden="true">🔍</span> ¿Qué tan poquito?
      </button>

    </div>
    <canvas id="zoom" aria-hidden="true"></canvas>
    <p class="paint-text" id="paintText">Te extraño una galaxia entera</p>
  </section>

  <!-- ============ ESCENA 2: el universo ============ -->
  <section class="universe" id="universe" aria-hidden="true">
    <canvas id="sky"></canvas>

    <div class="u-text" id="uText" aria-live="polite">
      <p class="line l1">Te extraño una galaxia entera</p>
      <p class="line l2">…aunque, en realidad, me quedé corto.</p>
      <div class="line l3">
        <p class="big">Te extraño como el universo entero</p>
        <p class="sub">infinito, sin bordes, y cada día un poquito más grande ✨</p>
      </div>
    </div>

    <p class="u-hint" id="uHint">Toca el cielo: cada estrella es una vez que pensé en ti</p>
    <p class="u-count" id="uCount" hidden>✨ <strong id="countNum">0</strong> <span id="countLbl">estrellas</span> para ti</p>

    <div class="u-actions" id="uActions">
      <button class="pill pill--main" id="letterBtn" type="button">💌 Leer mi carta</button>
      <button class="pill" id="replayBtn" type="button">🦔 Volver al erizo</button>
    </div>
  </section>

  <!-- ============ La carta ============ -->
  <div class="letter" id="letter" hidden role="dialog" aria-modal="true" aria-labelledby="letterTitle">
    <article class="letter-card">
      <button class="letter-close" id="letterClose" type="button" aria-label="Cerrar carta">✕</button>
      <h2 id="letterTitle"></h2>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-sign" id="letterSign"></p>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button class="sound-toggle" id="soundBtn" type="button" aria-pressed="true" aria-label="Sonido activado">
    <span class="on" aria-hidden="true">🔊</span><span class="off" aria-hidden="true">🔇</span>
  </button>

  <script src="script.js?v=6"></script>
</body>
</html>
