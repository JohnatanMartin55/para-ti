<!-- ============================================================
     TIPOGRAFÍA · Google Fonts
     Quicksand → lectura general · Caveat → revelación final
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   01 · RESET Y BASES
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;                 /* escena fija: sin scroll ni desbordes */
  overscroll-behavior: none;
}

body {
  font-family: 'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: #0b1030;
  color: var(--tinta);
  -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--foco);
  outline-offset: 6px;
  border-radius: 999px;
}

/* ============================================================
   02 · SISTEMA DE TOKENS
   ============================================================ */
:root {
  /* Noche */
  --noche-cenit:  #060a22;
  --noche-media:  #101a45;
  --noche-baja:   #26356f;
  --luna:         #f3f1e3;

  /* Día */
  --alba:         #ffd9a3;
  --dia-baja:     #ffeccd;
  --dia-media:    #a5d9f2;
  --dia-alta:     #4fa8e0;
  --sol:          #fff3c0;

  /* Tierra y campo */
  --colina-lejos: #7fae5e;
  --colina-cerca: #5d9247;
  --surco:        #4a7c3a;

  /* Girasol (paleta tomada de la ilustración de referencia) */
  --petalo:       #ffc81e;
  --petalo-hondo: #f0a81a;
  --corazon:      #3b2a18;
  --trama:        #6d4c28;
  --hoja:         #4a8a3a;
  --contorno:     #241c14;

  /* Texto y utilidades */
  --tinta:        #cdd6f7;
  --tinta-dia:    #2b3a52;
  --vidrio-borde: rgba(255, 255, 255, .38);
  --foco:         #ffd166;

  /* Física del movimiento */
  --entrada:      cubic-bezier(.16, 1, .30, 1);
  --rebote:       cubic-bezier(.34, 1.56, .64, 1);

  /* Duraciones */
  --t-cielo:      2600ms;

  /* Activo externo: sustituir la ruta para cambiar el ramo */
  --img-ramo:     url("girasoles.png");
}

/* ============================================================
   03 · ESCENARIO · capas apiladas (cielo → astros → paisaje → texto)
   ============================================================ */
.escena {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100dvh;
  min-height: 100vh;
  isolation: isolate;               /* confina los mix-blend-mode internos */
}

.capa {
  position: absolute;
  inset: 0;
  pointer-events: none;
  will-change: opacity;
}

.cielo--noche {
  z-index: 0;
  background:
    radial-gradient(130% 85% at 50% 108%, var(--noche-baja) 0%, transparent 62%),
    linear-gradient(180deg, var(--noche-cenit) 0%, #0b1030 46%, var(--noche-media) 100%);
  transition: opacity var(--t-cielo) var(--entrada);
}

.cielo--dia {
  z-index: 1;
  opacity: 0;
  background:
    radial-gradient(95% 62% at 22% 92%, var(--alba) 0%, transparent 62%),
    linear-gradient(180deg, var(--dia-alta) 0%, var(--dia-media) 46%, var(--dia-baja) 100%);
  transition: opacity var(--t-cielo) var(--entrada);
}

/* Estrellas estáticas: el modo noche no se mueve hasta la interacción */
.estrellas {
  z-index: 2;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 16%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 27% 38%, #e6edff, transparent),
    radial-gradient(1.8px 1.8px at 44% 11%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 61% 31%, #dde6ff, transparent),
    radial-gradient(1.7px 1.7px at 77% 18%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 89% 42%, #eaf0ff, transparent),
    radial-gradient(1.5px 1.5px at 33% 58%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 69% 54%, #d9e3ff, transparent),
    radial-gradient(1.6px 1.6px at 7%  48%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 53% 46%, #f0f4ff, transparent);
  transition: opacity 1400ms var(--entrada);
}

.luna {
  position: absolute;
  z-index: 3;
  top: 11%;
  right: 15%;
  width: clamp(54px, 8.5vw, 100px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 32%, #fffdf3 0%, var(--luna) 56%, #cec8b1 100%);
  box-shadow: 0 0 60px 18px rgba(243, 241, 227, .2);
  transform: translate3d(0, 0, 0);
  transition: transform 2400ms var(--entrada), opacity 1600ms var(--entrada);
}

/* Sol: entra desde bajo el horizonte con sobreimpulso */
.sol {
  position: absolute;
  z-index: 3;
  bottom: 26%;
  left: 15%;
  width: clamp(90px, 15vw, 180px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #fffdf0 0%, var(--sol) 48%, #ffcd72 100%);
  box-shadow: 0 0 90px 34px rgba(255, 210, 120, .45);
  opacity: 0;
  transform: translate3d(0, 48vh, 0) scale(.5);
  transition: transform 2700ms var(--rebote), opacity 1800ms var(--entrada);
  will-change: transform, opacity;
}

/* Nubes: sólo aparecen de día y derivan lentamente */
.nube {
  position: absolute;
  z-index: 4;
  height: clamp(24px, 3.6vw, 44px);
  width: clamp(86px, 15vw, 200px);
  border-radius: 999px;
  background: rgba(255, 255, 255, .8);
  opacity: 0;
  transform: translate3d(0, -16px, 0);
  transition: opacity 1600ms var(--entrada), transform 1600ms var(--entrada);
}
.nube::before, .nube::after {
  content: ""; position: absolute; bottom: 34%; border-radius: 50%; background: inherit;
}
.nube::before { left: 18%; width: 46%; aspect-ratio: 1; }
.nube::after  { right: 16%; width: 34%; aspect-ratio: 1; }
.nube--a { top: 14%; left: -16%; }
.nube--b { top: 25%; left: 48%; }

/* ============================================================
   03b · VIDA DE LA ESCENA
   Estrellas que titilan y derivan, luciérnagas que revolotean
   de noche, y mariposas que cruzan el campo de día.
   Todo con ciclos largos y desfasados: nada late al mismo
   tiempo, así el movimiento se lee como respiración y no
   como parpadeo.
   ============================================================ */

/* --- Estrellas --- */
.estrella {
  position: absolute;
  left: var(--x);
  top: var(--y);
  animation: vagar var(--deriva) ease-in-out var(--del) infinite alternate;
}
.estrella::after {
  content: "";
  display: block;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 7px 1.5px rgba(255, 255, 255, .5);
  opacity: .7;
  animation: titilar var(--dur) ease-in-out var(--del) infinite alternate;
}

/* Deriva casi imperceptible: unos pocos píxeles en decenas de segundos */
@keyframes vagar {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(var(--dx), var(--dy), 0); }
}
@keyframes titilar {
  from { opacity: .22; transform: scale(.82); }
  to   { opacity: 1;   transform: scale(1.06); }
}

/* --- Luciérnagas --- */
.nocturnos {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  transition: opacity 1800ms var(--entrada);
}
.luciernaga {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #f2ffb0;
  box-shadow: 0 0 12px 4px rgba(226, 255, 150, .45);
  animation:
    revolotear var(--dur) ease-in-out var(--del) infinite alternate,
    latir var(--pulso) ease-in-out var(--del) infinite alternate;
}
/* Recorrido errático pero lento: el vuelo nunca repite el mismo tramo */
@keyframes revolotear {
  0%   { transform: translate3d(0, 0, 0); }
  25%  { transform: translate3d(var(--a), var(--b), 0); }
  50%  { transform: translate3d(var(--c), var(--d), 0); }
  75%  { transform: translate3d(var(--e), var(--f), 0); }
  100% { transform: translate3d(var(--g), var(--h), 0); }
}
@keyframes latir {
  from { opacity: .15; }
  to   { opacity: .95; }
}

/* --- Mariposas --- */
.diurnos {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1600ms var(--entrada);
}
.mariposa {
  position: absolute;
  top: var(--y);
  left: 0;
  width: var(--w);
  height: auto;
  overflow: visible;
  animation: cruzar var(--dur) linear var(--del) infinite;
}
.mariposa .ala {
  transform-origin: 22px 16px;
  animation: aletear var(--aleteo) ease-in-out infinite alternate;
}
/* Travesía completa del encuadre, con altibajos suaves */
@keyframes cruzar {
  0%   { transform: translate3d(-12vw, 0, 0) rotate(-5deg); }
  25%  { transform: translate3d(20vw, -7vh, 0) rotate(4deg); }
  50%  { transform: translate3d(50vw, 1vh, 0) rotate(-3deg); }
  75%  { transform: translate3d(78vw, -6vh, 0) rotate(5deg); }
  100% { transform: translate3d(112vw, 0, 0) rotate(-5deg); }
}
@keyframes aletear {
  from { transform: scaleX(1); }
  to   { transform: scaleX(.32); }
}

/* ============================================================
   04 · PAISAJE · SVG del campo de girasoles
   Ocupa el tercio inferior y escala con `slice` para cubrir
   cualquier proporción sin deformarse.
   ============================================================ */
.paisaje {
  position: absolute;
  z-index: 5;
  inset: auto 0 0 0;
  width: 100%;
  height: clamp(200px, 42vh, 460px);
  pointer-events: none;
  /* De noche el campo queda apagado; el amanecer le devuelve el color */
  filter: brightness(.30) saturate(.35) blur(.2px);
  transition: filter var(--t-cielo) var(--entrada);
  will-change: filter;
}

.colina { transition: fill var(--t-cielo) var(--entrada); }

/* Cada planta rota sobre la base de su tallo (heliotropismo) */
.planta {
  pointer-events: auto;
  cursor: default;
}
.planta__cuerpo {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transform: rotate(-19deg) scale(.94);   /* de noche: cabizbajo */
  transition: transform 1500ms var(--rebote);
  will-change: transform;
}

/* Interacción menor: al pasar, tocar o enfocar, el girasol asiente */
.planta:hover  .planta__cuerpo,
.planta:focus  .planta__cuerpo,
.planta:active .planta__cuerpo {
  transform: rotate(calc(var(--giro, 0deg) + 7deg)) scale(1.03);
  transition-duration: 520ms;
}

/* Cada girasol guarda un detalle. El texto vive dentro de un ancla
   con la escala invertida, así todas las frases miden lo mismo
   aunque las plantas estén a distintas profundidades. */
.planta__globo {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 320ms var(--entrada), transform 460ms var(--rebote);
  pointer-events: none;
}

.planta__frase {
  font-family: 'Caveat', cursive;
  font-size: 30px;
  font-weight: 700;
  fill: #22364f;
  stroke: #fffdf6;                  /* halo: legible sobre cielo o campo */
  stroke-width: 7;
  paint-order: stroke fill;
  stroke-linejoin: round;
}

/* Las frases sólo existen de día */
.es-dia .planta:hover  .planta__globo,
.es-dia .planta:focus  .planta__globo,
.es-dia .planta:active .planta__globo {
  opacity: 1;
  transform: translateY(0);
}

/* ============================================================
   05 · RAMO · activo externo fusionado con el cielo
   `mix-blend-mode: multiply` disuelve el fondo blanco del PNG
   contra el degradado: de noche se oscurece solo, de día se aclara.
   ============================================================ */
.ramo {
  position: absolute;
  z-index: 8;
  left: 50%;
  bottom: 0;
  width: clamp(220px, 34vw, 430px);
  aspect-ratio: 464 / 358;
  background: var(--img-ramo) center bottom / contain no-repeat;
  opacity: 0;
  transform: translate3d(-50%, 90px, 0);
  transition: transform 1500ms var(--rebote), opacity 1100ms var(--entrada);
  pointer-events: none;
  will-change: transform, opacity;
}

/* Utilidad de fusión reutilizable para cualquier recurso con fondo blanco */
.fusion-multiply { mix-blend-mode: multiply; }

/* ============================================================
   06 · DISPARADOR (estado inicial)
   ============================================================ */
.disparador {
  position: relative;
  z-index: 20;
  display: grid;
  gap: 1rem;
  justify-items: center;
  width: min(560px, 88vw);
  padding: clamp(1.6rem, 5vw, 2.4rem) clamp(1.6rem, 6vw, 2.8rem);
  border-radius: 28px;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .16);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  transition: opacity 700ms ease, transform 700ms var(--entrada);
}

/* Frase nocturna: mayúsculas espaciadas, el contrapunto sobrio
   de la caligrafía que llega con el día */
.disparador__frase {
  font-size: clamp(1rem, 2.5vw, 1.24rem);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .045em;
  line-height: 1.6;
  max-width: 30ch;
  text-align: center;
  text-wrap: balance;
}

.disparador__pista {
  display: grid;
  gap: .8rem;
  justify-items: center;
  font-size: clamp(.78rem, 2vw, .9rem);
  opacity: .58;
  letter-spacing: .02em;
}

.disparador__anillo {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, .5);
  display: grid; place-items: center;
}
.disparador__anillo::after {
  content: ""; width: 13px; height: 13px; border-radius: 50%;
  background: var(--luna);
  box-shadow: 0 0 22px 6px rgba(243, 241, 227, .35);
}

/* ============================================================
   07 · TARJETA DE MENSAJE · Glassmorphism
   ============================================================ */
.mensaje {
  position: relative;
  z-index: 15;
  width: min(540px, 88vw);
  margin-bottom: clamp(60px, 16vh, 150px);   /* despeja el ramo inferior */
  padding: clamp(1.5rem, 5vw, 2.6rem);
  border-radius: 26px;
  background: rgba(255, 255, 255, .24);
  border: 1px solid var(--vidrio-borde);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 22px 60px -22px rgba(30, 45, 70, .45),
              inset 0 1px 0 rgba(255, 255, 255, .5);
  color: var(--tinta-dia);
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transform: translate3d(0, 34px, 0) scale(.97);
  transition: transform 1200ms var(--rebote),
              opacity 900ms var(--entrada),
              visibility 0s linear 1200ms;
}

/* Mensaje del día: la caligrafía es la revelación, así que aquí
   vive Caveat y no en un remate suelto al final */
.linea {
  font-family: 'Caveat', cursive;
  font-size: clamp(1.55rem, 4.6vw, 2.15rem);
  font-weight: 500;
  line-height: 1.35;
  color: #1f3350;
  max-width: 22ch;
  text-wrap: balance;
  margin-inline: auto;
  opacity: 0;
  transform: translate3d(0, 24px, 0);
  filter: blur(5px);
  transition: transform 900ms var(--entrada),
              opacity 900ms var(--entrada),
              filter 900ms var(--entrada);
}
.linea + .linea { margin-top: .55rem; }

.firma {
  margin-top: clamp(1.2rem, 3.6vw, 1.7rem);
  padding-top: 1rem;
  border-top: 1px solid rgba(255, 255, 255, .45);
  opacity: 0;
  transition: opacity 500ms var(--entrada);
}

/* El nombre no se desvanece: se escribe. Una máscara `inset` viaja
   de izquierda a derecha, como si alguien pasara el bolígrafo. */
.firma__nombre {
  display: block;
  padding: 0 .12em .08em;
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: clamp(2.6rem, 9vw, 3.6rem);
  line-height: 1.1;
  color: #1b2f4a;
  clip-path: inset(0 100% 0 0);
  transition: clip-path 1500ms cubic-bezier(.62, .05, .38, .98);
}

/* Trazo bajo el nombre, dibujado con el mismo gesto */
.firma__trazo {
  display: block;
  width: min(210px, 60%);
  height: 12px;
  margin: .1rem auto 0;
  overflow: visible;
}
.firma__trazo path {
  fill: none;
  stroke: #d99b16;
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-dasharray: 230;
  stroke-dashoffset: 230;
  transition: stroke-dashoffset 900ms var(--entrada);
}

.firma__pie {
  display: block;
  margin-top: .55rem;
  font-family: 'Caveat', cursive;
  font-size: clamp(1.1rem, 3.2vw, 1.35rem);
  font-weight: 500;
  color: #3c5170;
  opacity: 0;
  transition: opacity 700ms var(--entrada);
}

/* ============================================================
   08 · CONTROLES INFERIORES
   ============================================================ */
.pie {
  position: absolute;
  z-index: 25;
  left: 50%;
  bottom: max(1rem, env(safe-area-inset-bottom));
  display: flex;
  flex-wrap: wrap;
  gap: .6rem 1rem;
  align-items: center;
  justify-content: center;
  width: max-content;
  max-width: 92vw;
  transform: translateX(-50%) translateY(10px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 600ms ease 5600ms,
              transform 600ms var(--entrada) 5600ms,
              visibility 0s linear 6200ms;
}
.pie__pista {
  font-size: .85rem;
  color: var(--tinta-dia);
  opacity: .7;
}
.regreso {
  padding: .55rem 1.2rem;
  border-radius: 999px;
  font-size: .86rem;
  font-weight: 500;
  color: var(--tinta-dia);
  background: rgba(255, 255, 255, .34);
  border: 1px solid var(--vidrio-borde);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.regreso:hover { background: rgba(255, 255, 255, .5); }

/* ============================================================
   09 · MÁQUINA DE ESTADOS
   Toda la coreografía cuelga de una sola clase en <body>.
   ============================================================ */
.es-dia .cielo--noche { opacity: 0; }
.es-dia .cielo--dia   { opacity: 1; }
.es-dia .estrellas    { opacity: 0; }
.es-dia .luna         { opacity: 0; transform: translate3d(16px, -24vh, 0) scale(.85); }
.es-dia .sol          { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }

.es-dia .nube   { opacity: .88; transition-delay: 1800ms; animation: deriva 46s linear 2600ms infinite; }
.es-dia .nube--b{ transition-delay: 2200ms; animation-duration: 64s; animation-delay: 3200ms; }

@keyframes deriva {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(130vw, 0, 0); }
}

/* La vida de la escena se releva: se apagan las luciérnagas,
   salen las mariposas */
.es-dia .nocturnos { opacity: 0; }
.es-dia .diurnos   { opacity: 1; transition-delay: 2000ms; }
.es-dia .estrella  { animation-play-state: paused; }

/* El campo recupera color con el mismo ritmo que el cielo */
.es-dia .paisaje { filter: brightness(1) saturate(1); }

/* Los girasoles se enderezan y giran hacia el sol, en cascada */
.es-dia .planta__cuerpo {
  transform: rotate(var(--giro, 0deg)) scale(1);
  transition-delay: var(--retraso, 0ms);
}

.es-dia .disparador { opacity: 0; transform: translate3d(0, -14px, 0); pointer-events: none; }

.es-dia .mensaje {
  opacity: 1;
  visibility: visible;
  transform: translate3d(0, 0, 0) scale(1);
  transition-delay: 700ms, 700ms, 0s;
}

/* Cascada de lectura secuencial */
.es-dia .linea { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0); }
.es-dia .linea:nth-of-type(1) { transition-delay: 1150ms; }
.es-dia .linea:nth-of-type(2) { transition-delay: 1800ms; }
.es-dia .linea:nth-of-type(3) { transition-delay: 2450ms; }

.es-dia .firma {
  opacity: 1;
  transition-delay: 3200ms;
}
.es-dia .firma__nombre {
  clip-path: inset(0 0 0 0);
  transition-delay: 3350ms;
}
.es-dia .firma__trazo path {
  stroke-dashoffset: 0;
  transition-delay: 4500ms;
}
.es-dia .firma__pie {
  opacity: .85;
  transition-delay: 5000ms;
}

.es-dia .ramo {
  opacity: 1;
  transform: translate3d(-50%, 0, 0);
  transition-delay: 2400ms;
}

.es-dia .pie { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

/* ============================================================
   10 · RESPONSIVIDAD
   ============================================================ */

/* Móvil vertical */
@media (max-width: 600px) {
  .sol   { bottom: 30%; left: 8%; }
  .luna  { top: 9%; right: 8%; }
  .nube--b { display: none; }
  .mensaje { width: 92vw; border-radius: 22px; margin-bottom: clamp(90px, 20vh, 170px); }
  .ramo  { width: clamp(200px, 62vw, 300px); }
  .paisaje { height: clamp(180px, 34vh, 320px); }
}

/* Alturas cortas (móvil apaisado): la escena se comprime sin romperse */
@media (max-height: 540px) {
  .paisaje { height: 46vh; }
  .sol { bottom: 12%; width: clamp(64px, 11vw, 110px); }
  .mensaje { padding: 1rem 1.3rem; margin-bottom: 3.4rem; }
  .linea + .linea { margin-top: .55rem; }
  .firma { margin-top: .8rem; padding-top: .7rem; }
  .ramo { width: clamp(150px, 22vw, 240px); }
}

/* Monitores ultrawide: se contiene la escala y se recentra la composición */
@media (min-width: 1600px) {
  .mensaje { width: 600px; }
  .sol  { left: 24%; }
  .luna { right: 24%; }
  .ramo { width: 460px; }
  .paisaje { height: clamp(320px, 40vh, 520px); }
}

/* Movimiento reducido: se conserva la narrativa, se anula la física */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 240ms !important;
    transition-delay: 0ms !important;
    animation: none !important;
  }
  .linea, .firma, .sol, .planta__cuerpo { transform: none !important; filter: none !important; }
  .firma__nombre { clip-path: none !important; }
  .firma__trazo path { stroke-dashoffset: 0 !important; }
  .planta__globo { transform: none !important; }
  .ramo { transform: translate3d(-50%, 0, 0) !important; }
}

<script>
/* ============================================================
   CONTROLADORES DE ESTADO · Vanilla JS
   Responsabilidad única: capturar el evento y mutar la clase.
   Ninguna animación se calcula aquí; el CSS asume el 100 %.
   ============================================================ */
(function () {
  'use strict';

  var cuerpo     = document.body;
  var disparador = document.getElementById('disparador');
  var regreso    = document.getElementById('regreso');
  var ESTADO_DIA = 'es-dia';

  /* Amanecer: dispara la cascada completa de transiciones */
  function amanecer() {
    if (cuerpo.classList.contains(ESTADO_DIA)) return;
    cuerpo.classList.add(ESTADO_DIA);
    cuerpo.style.setProperty('--tinta', 'var(--tinta-dia)');
  }

  /* Anochecer: revierte al estado inicial y permite repetir la escena */
  function anochecer() {
    cuerpo.classList.remove(ESTADO_DIA);
    cuerpo.style.removeProperty('--tinta');
    disparador.focus({ preventScroll: true });
  }

  disparador.addEventListener('click', amanecer);
  regreso.addEventListener('click', anochecer);
})();
</script>
